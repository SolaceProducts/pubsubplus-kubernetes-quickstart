name: Build and Test in Development phase

on:
  push:
    branches-ignore:
      - main

env:
  VERSION: 1.4.2
  IMAGE_NAME: pubsubplus-eventbroker-operator
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  GCLOUD_PROJECT_ID_DEV: ${{ secrets.GCLOUD_PROJECT_ID }}


jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      repository-projects: read
      contents: read
      actions: read
      id-token: write
      packages: write
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"

      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Login to Github Packages
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@ef5d53e30bbcd8d0836f4288f5e50ff3e086997d # v1.0.0
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          access_token_lifetime: 600s

      - name: Use the GKE Autopilot test cluster
        uses: google-github-actions/get-gke-credentials@ef10cc0013c465a6ea0b8e36c24064576ec25f87 # v1.0.0
        with:
          cluster_name: 'dev-integrationtesting'
          location: 'us-central1'


      - name: Create k8s Kind Cluster for Unit Tests
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        run: echo ::set-env name=KUBE_CONFIG_DATA::$(base64 -w 0 ~/.kube/config)
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
#        uses: helm/kind-action@v1.12.0

      - name: Unit Test and Coverage Report.
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        run: |
            mkdir -p reports
            make test-coverage

      - name: Upload Test coverage Reports
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-coverage-report
          path: |
            ./reports/cover.out
            ./reports/cover.html

      - name: Go Coverage Badge
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        uses: tj-actions/coverage-badge-go@84540b9f82b4f569ac9f248cf6f2893ac3cc4791 # v2
        with:
          filename: ./reports/coverage.out

      - name: Verify Changed files
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: README.md

      - name: Commit changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "chore: Updated coverage badge."


      - name: Lint and Build
        run: |
          go fmt ./... | wc -l | grep 0
          make docker-build

      - name: Set up Docker Buildx
        id: buildx
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      # Checkout only feeds the Prisma vulnerability check below, which is disabled - skip it too
      # (its RELEASE_GITHUB_TOKEN checkout was failing with no consumer left to justify fixing it)

      - name: Build image and push GitHub Container Registry
        run: make docker-push

#      - name: Run Vulnerability PreCheck for Prisma
#        uses: ./maas-build-actions/.github/actions/prisma-vulnerability-checker
#        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
#        with:
#          docker_image_to_check: gcr.io/${{ env.GCLOUD_PROJECT_ID_DEV }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
#          prisma_repository_name: "gcr.io/${{ env.GCLOUD_PROJECT_ID_DEV }}/${{ env.IMAGE_NAME }}"
#          project_squad: "launchpad"
#          prisma_jira_check: "False"


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        with:
          image-ref: ghcr.io/solacedev/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Uploads Trivy Scan Reports
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: |
            trivy-results.sarif

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        with:
          image-ref: ghcr.io/solacedev/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Uploads Trivy Scan Reports
        if: ${{ startsWith(github.ref_name, 'dev1.') && (github.ref_name != 'main') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: |
            trivy-results.sarif


  int-minimal-non-ha:
